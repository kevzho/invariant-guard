# InvariantGuard demo configuration. Domains below are explicit admissions of
# exact built-in integer inputs for the named demo functions.
schema_version = "1.0"

[analysis]
languages = ["python"]
mode = "quick"
solver_enabled = true
per_query_timeout_ms = 100
quick_budget_ms = 2000
require_coverage = true

[execution]
enabled = false
profile = ""
allow_unisolated = false

[semantic]
enabled = false

[privacy]
telemetry = false
store_raw_model_context = false
retain_replay_source = false
store_witnesses = true

[scope]
exclude = [".git", ".guard", ".venv", "vendor", "node_modules"]

[[domains]]
symbol = "baseline/ratio.py::ratio"
profile = "python_exact_builtin_ints"
authority = "DECLARED"
reason = "demo public API admits exact built-in integer inputs"

