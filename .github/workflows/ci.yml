name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Pins come from requirements.lock (as constraints, so the paper-only extra is not installed).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock -e '.[solver,mcp,dev]'
      - name: Tests (offline; Docker and real-model tests skip)
        run: python -m pytest -q
      - name: Demo smoke
        run: |
          set +e
          guard check examples/python_demo/candidate --format json > /dev/null; test $? -eq 1 || exit 1
          guard check examples/python_demo/baseline --format json > /dev/null; test $? -eq 0 || exit 1

  docker:
    name: isolated runner (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock -e '.[solver,mcp,dev]'
      # Explicit setup step: the only network use. Tests never pull images themselves.
      - name: Prepare images
        run: |
          docker pull python:3.13-slim
          docker build -t invariantguard-diffreplay:spike spikes/diffreplay
      - name: Docker-backed tests
        run: >
          python -m pytest -q -rs
          tests/integration/test_docker_isolation.py
          tests/integration/test_contracts_dynamic.py
          tests/integration/test_execution_failclosed.py
          tests/integration/test_replay_harness.py
          tests/integration/test_replay_generate.py
          tests/integration/test_verify_replay.py
          tests/integration/test_mcp_server.py

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.3.0 twine==6.2.0
      - run: python -m build
      - run: python -m twine check --strict dist/*
