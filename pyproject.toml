[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invariantguard"
version = "0.5.0"
description = "Local-first, change-scoped verification layer for coding-agent patches (M0-M5: static Python slice, change-aware verification, behavioral contracts with an isolated probe runner, local open-weight contract proposals, opt-in remote and agent contract proposers, stdio MCP server)"
readme = "README.md"
requires-python = ">=3.11"
# The core has no runtime dependencies: stdlib ast/symtable/tomllib/argparse only.
dependencies = []

[project.optional-dependencies]
# Exact versions tested on the reference host (see docs/IMPLEMENTATION_STATUS.md).
solver = ["z3-solver==5.1.0.0"]
# M5: `guard mcp serve --stdio` (official MCP Python SDK; its transitive pins are in requirements.lock).
mcp = ["mcp==2.3.0"]
# Paper: figures generated by paper/make_tables.py (its transitive pins are in requirements.lock).
paper = ["matplotlib==3.11.2"]
dev = [
    "pytest==9.1.1",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
]

[project.scripts]
guard = "invariantguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invariantguard = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
