[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invariantguard"
version = "0.5.0"
description = "Local-first verifier for coding-agent patches: modeled runtime-failure analysis, behavioral contracts and differential replay for Python (alpha research preview)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Kevin Zhou" }]
keywords = ["static-analysis", "verification", "coding-agents", "mcp", "smt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# The core has no runtime dependencies: stdlib ast/symtable/tomllib/argparse only.
dependencies = []

[project.optional-dependencies]
# Exact versions tested on the reference host (see docs/IMPLEMENTATION_STATUS.md).
solver = ["z3-solver==5.1.0.0"]
# M5: `guard mcp serve --stdio` (official MCP Python SDK; its transitive pins are in requirements.lock).
mcp = ["mcp==2.3.0"]
# Paper: figures generated by paper/make_tables.py (its transitive pins are in requirements.lock).
paper = ["matplotlib==3.11.2"]
dev = [
    "pytest==9.1.1",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
]

[project.scripts]
guard = "invariantguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invariantguard = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
